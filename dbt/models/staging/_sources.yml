version: 2

sources:
  - name: raw
    description: "Synthetic subscription billing data generated by app/utils/generate_synthetic_data.py."
    tables:
      - name: subscriptions
        description: "One row per user per active billing month."
        meta:
          external_location: "read_csv_auto('../data/raw/subscriptions.csv')"
        columns:
          - name: user_id
            description: "Unique subscriber identifier."
          - name: region_id
            description: "Subscriber's billing region (US, EMEA, APAC, LATAM)."
          - name: plan_type
            description: "Subscription tier at the time of this billing period (Basic, Standard, Premium)."
          - name: billing_period_start
            description: "First day of the billing period."
          - name: billing_period_end
            description: "Last day of the billing period; earlier than the full month end when the user cancels mid-period."
          - name: net_revenue_usd
            description: "Revenue billed for this period, after promotional discounts and mid-month proration."
          - name: is_paid_tier
            description: "False for free trial months; these contribute zero revenue and must not count toward active_paid_subscribers."
